    html, body {

    body {

    }
    
    /* –––––––––– SIDEBAR – NEO-GLASS –––––––––– */

      width: 260px;
      min-width: 200px;
      background: rgba(8, 12, 21, 0.85);

    #sidebar ul {

      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;

    }
    
    #sidebar li {

      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.3px;
      background: transparent;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      backdrop-filter: blur(4px);
    }
    
    #sidebar a i {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
      color: #5fa8ff;
    }
    
    #sidebar a:hover {
      background: rgba(30, 144, 255, 0.15);
      border: 1px solid rgba(0, 180, 255, 0.4);
      box-shadow: 0 8px 16px rgba(0,120,255,0.1);
      color: white;

    }
    
    /* –––––––––– MAIN – DARK IMMERSIVE –––––––––– */
    #mainContent {
      flex-grow: 1;
      overflow-y: auto;

      min-width: 0;

      backdrop-filter: blur(2px);

    /* Profile card – glassmorphism */

      flex-wrap: wrap;

      flex-wrap: wrap;
      align-items: center;
      gap: 12px;

    /* CHAT BUBBLE – cosmic */
    #chatBubble {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #2a80ff, #001d4a);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 35px #0099ff, 0 0 0 3px #ffffff40;
      backdrop-filter: blur(6px);
      font-size: 2rem;
      transition: 0.2s;
      z-index: 9999;
    }
    
    #chatBubble:hover {
      transform: scale(1.1);
      background: #004cff;
      box-shadow: 0 0 50px #3f9eff;
    }
    
    #chatUsername {
      font-size: 12px;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    
    #chatBadge {
      position: absolute;
      top: 6px;
      right: 8px;
      background: #ff3b3b;
      color: white;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 30px;
      font-weight: 800;
      box-shadow: 0 0 15px red;
    }
    
    /* OVERLAY – full immersive */
    #iframeOverlay {
      background: rgba(2, 5, 15, 0.98);
      backdrop-filter: blur(18px);
    }
    
    #closeIframe {
      background: rgba(255,255,255,0.1) !important;
      border: 1.5px solid cyan !important;
      width: 48px !important;
      height: 48px !important;
      font-size: 28px !important;
      color: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    #closeIframe:hover { background: #ff0066 !important; border-color: white; }
    
    /* mobile refinements */
    @media (max-width: 900px) {
      #sidebar { width: 200px; padding: 20px 10px; }
      #mainContent { padding: 24px 18px; }
      h1 { font-size: 2.2rem; }
      .profile-header { flex-direction: column; align-items: flex-start; }
      .profile-header div { margin-left: 0; width: 100%; }
    }
    
    @media (max-width: 650px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 2px solid cyan; backdrop-filter: blur(25px); }
      #sidebar ul { flex-flow: row wrap; }
      #mainContent { padding: 20px; }

    /* custom scroll */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0a111c; }
    ::-webkit-scrollbar-thumb { background: #256ba0; border-radius: 30px; border: 2px solid #003355; }
  </style>

<script>
// ========================
//  SIDEBAR OVERLAY (cosmic)
// ========================
const links = document.querySelectorAll('#sidebar a');
const overlay = document.getElementById('iframeOverlay');
const overlayFrame = document.getElementById('overlayFrame');
const closeBtn = document.getElementById('closeIframe');

links.forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    overlayFrame.src = link.href;
    overlay.style.display = 'block';
  });
});

closeBtn.addEventListener('click', () => {
  overlayFrame.src = '';
  overlay.style.display = 'none';
});

// ========================
//  CHAT NAVIGATION
// ========================
function openChat() { window.location.href = '/chat.html'; }

// ========================
//  PROFILE (ADVANCED UI)
// ========================
async function loadProfile() {
  try {
    const res = await fetch('/.netlify/functions/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include'
    });
    const result = await res.json();
    if (!result.success) throw new Error(result.error || 'Failed to fetch user');

    const user = result.user || {};
    window.userEmail = user.email;
    const online = !!user.online;
    const avatarUrl = user.avatar_url || `https://avatars.dicebear.com/api/initials/${encodeURIComponent(user.email || 'user')}.svg`;

    const profileHtml = `
      <img id="avatarPreview" src="${avatarUrl}" alt="Profile" />
      <span style="display:flex; flex-direction:column;">
        <span style="font-size:1.8rem; line-height:1.2;">${user.username || user.email || 'Explorer'}</span>
        <span style="font-size:1rem; display:flex; align-items:center; gap:6px;">
          <span class="status-dot ${online ? 'online' : 'offline'}" style="width:14px; height:14px; border-radius:50%; background:${online ? '#2aff6e' : '#aaaaaa'}; box-shadow:0 0 16px ${online ? '#0f0' : 'none'};"></span>
          <span id="statusIndicator" class="${online ? 'online' : 'offline'}">${online ? 'ONLINE' : 'OFFLINE'}</span>
        </span>
      </span>
      <div style="margin-left:auto; display:flex; flex-wrap:wrap; gap:16px;">
        <div style="display:flex; flex-direction:column; gap:8px; background:transparent; border:none; backdrop-filter:none;">
          <div style="display:flex; gap:10px; align-items:center;">
            <i class="fas fa-avatar"></i>
            <input type="text" id="avatarInput" placeholder="new avatar URL" value="${avatarUrl}" style="min-width:200px; margin:0; background:#0a1424;" />
            <button id="updateAvatarBtn" style="width:auto; margin:0; padding:12px 26px;"><i class="fas fa-sync-alt"></i> UPDATE</button>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <i class="fas fa-signal"></i>
            <select id="statusSelect" style="min-width:140px; margin:0; background:#0a1424;">
              <option value="true" ${online ? 'selected' : ''}>🟢 ONLINE</option>
              <option value="false" ${!online ? 'selected' : ''}>⚫ OFFLINE</option>
            </select>
            <button id="updateStatusBtn" style="width:auto; margin:0; padding:12px 26px;"><i class="fas fa-cloud-upload-alt"></i> COMMIT</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('profile').innerHTML = profileHtml;
    document.getElementById('chatUsername').textContent = user.username || user.email || 'Chat';

    // Update avatar
    document.getElementById('updateAvatarBtn').addEventListener('click', async () => {
      const newAvatar = document.getElementById('avatarInput').value.trim();
      if (!newAvatar) return alert('🌌 enter valid URL');
      const res = await fetch('/.netlify/functions/settings', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({ avatar_url: newAvatar })
      });
      const data = await res.json();
      if(data.success){ document.getElementById('avatarPreview').src = newAvatar; alert('✨ avatar morphed'); }
      else alert('❌ failed: '+data.error);
    });

    // Update status
    document.getElementById('updateStatusBtn').addEventListener('click', async () => {
      const newStatus = document.getElementById('statusSelect').value==='true';
      const res = await fetch('/.netlify/functions/settings', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body: JSON.stringify({ online: newStatus })
      });
      const data = await res.json();
      if(data.success){
        const s = document.getElementById('statusIndicator');
        s.textContent = newStatus?'ONLINE':'OFFLINE';
        s.className = newStatus?'online':'offline';
        document.querySelector('.status-dot').style.background = newStatus?'#2aff6e':'#aaaaaa';
        alert('⚡ status transmitted');
      } else alert('❌ '+data.error);
    });

  } catch(e){ console.error(e); }
}

// ========================
//  FRIEND REQUESTS (with style)
// ========================
async function loadIncoming() {
  try {
    const res = await fetch('/.netlify/functions/friend-requests', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ action:'list', user_email: window.userEmail })
    });
    const data = await res.json();
    const container = document.getElementById('incomingRequests');
    container.innerHTML = '';
    if (!data.length) { 
      container.innerHTML = '<div style="background:transparent; border:1px dashed #3b6e9c; justify-content:center; color:#adccff;"><i class="fas fa-star"></i> no incoming requests — cosmos is quiet</div>'; 
      return; 
    }
    data.forEach(req => {
      const div = document.createElement('div');
      div.innerHTML = `<span style="display:flex; gap:10px;"><i class="fas fa-user-astronaut" style="color:#5ad0ff;"></i> ${req.sender_email}</span>
        <span>
          <button onclick="respond('${req.id}','accepted')" style="background:#007f5f; box-shadow:0 6px 0 #003d2b;"><i class="fas fa-check-circle"></i> ACCEPT</button>
          <button onclick="respond('${req.id}','rejected')" style="background:#6b2d3b; box-shadow:0 6px 0 #3a1a22; margin-left:10px;"><i class="fas fa-times-circle"></i> REJECT</button>
        </span>`;
      container.appendChild(div);
    });
  } catch(e){ console.error(e); }
}

window.respond = async (id,status) => {
  const res = await fetch('/.netlify/functions/friend-requests',{
    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
    body: JSON.stringify({ action:'respond', request_id:id, status })
  });
  const data = await res.json();
  alert(data.success ? `⛓️ request ${status}` : '⚠️ '+data.error);
  loadIncoming();
};

document.getElementById('sendRequestBtn').addEventListener('click', async ()=>{
  const receiver_email = document.getElementById('friendEmail').value;
  if (!receiver_email) return alert('🌀 enter email');
  const res = await fetch('/.netlify/functions/friend-requests',{
    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
    body: JSON.stringify({ action:'send', sender_email: window.userEmail, receiver_email })
  });
  const data = await res.json();
  alert(data.success ? '✨ request sent!' : '⚠️ '+data.error);
  loadIncoming();
});

// ========================
//  BOT CREATION (FORGE)
// ========================
const form = document.getElementById('botForm');
const output = document.getElementById('output');
const voiceSelect = document.getElementById('voiceSelect');
const fbxSelect = document.getElementById('fbxSelect');

async function loadVoices() {
  try {
    const res = await fetch('/.netlify/functions/get-voices',{ method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include' });
    const voices = await res.json();
    voiceSelect.innerHTML = '<option value="">🎤 SELECT VOICE PROFILE</option>';
    voices.forEach(v=>{ const opt=document.createElement('option'); opt.value=v.id; opt.textContent=`🎙️ ${v.name} (${v.lang})`; voiceSelect.appendChild(opt); });
  } catch(e){ voiceSelect.innerHTML='<option value="">⚠️ voice offline</option>'; console.error(e);}
}

const fbxModels = [{id:'model1',name:'HUMANOID · NEO'},{id:'model2',name:'ROBOT · MECH'}];
fbxModels.forEach(m=>{ const opt=document.createElement('option'); opt.value=m.id; opt.textContent=`🧊 ${m.name}`; fbxSelect.appendChild(opt); });

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const name=document.getElementById('botName').value.trim();
  const description=document.getElementById('description').value.trim();
  const voice_id=voiceSelect.value;
  const fbx_model_id=fbxSelect.value;
  const paid_link=document.getElementById('gumroadLink').value.trim();

  if(!name||!description||!voice_id||!fbx_model_id){ output.innerHTML='<i class="fas fa-exclamation-triangle"></i> ALL CORE FIELDS REQUIRED.'; output.className='output error'; return; }
  output.innerHTML='<i class="fas fa-spinner fa-pulse"></i> INFUSING BOT WITH SOUL ...'; output.className='output';

  try{
    const res = await fetch('/.netlify/functions/overpoweredbot',{
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({ name, description, voice_id, fbx_model_id, paid_link })
    });
    const data = await res.json();
    if(!res.ok||data.error){ output.innerHTML=`❌ ERROR: ${data.error||'unknown'}`; output.className='output error'; return; }
    output.innerHTML=`
      <i class="fas fa-check-circle" style="color:#6effa0;"></i> <strong style="font-size:1.6rem;">BOT IGNITED</strong><br>
      <span style="background: #0f2640; padding:10px; border-radius:50px;">🤖 ID: ${data.id||'N/A'}</span><br>
      🔑 API KEY: <span style="background:#002a4a; padding:6px 14px; border-radius: 30px;">${data.apiKey||'embedded'}</span><br>
      📦 MANIFEST: bot.js · neural core stable<br><br>
      <a href="/explore.html" style="color:#9adcff; font-weight:bold; border:1px solid cyan; padding:10px 20px; border-radius:50px; text-decoration:none;"><i class="fas fa-search"></i> EXPLORE UNIVERSE</a>
    `;
    output.className='output success';
    form.reset();
  }catch(e){ output.innerHTML='💥 BOT SYNTHESIS FAILED.'; output.className='output error'; }
});

// ========================
//  INITIATE
// ========================
loadProfile().then(loadIncoming).then(loadVoices);
</script>
